name: Auto'd Synthesizer

on:
  schedule:
    # Trigger every 2 days at 00:00 UTC
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain (aerospace_orbital | numerical_physics | computational_math | systems_compilers | crypto_algorithms | auto)"
        required: false
        default: "auto"
      name:
        description: "Custom repository name (optional, leave empty for auto-ideation)"
        required: false
        default: ""
      dry_run:
        description: "Simulate synthesis and verification without creating GitHub repo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Auto'd
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_IMPROVER_TOKEN || github.token }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-cov numpy build

      - name: Synthesize and publish repository
        env:
          GH_TOKEN: ${{ secrets.REPO_IMPROVER_TOKEN }}
          # Permanent-free-tier providers (add a secret to activate that tier)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM3_API_KEY: ${{ secrets.LLM3_API_KEY }}
          LLM2_API_KEY: ${{ secrets.LLM2_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN_INPUT: ${{ inputs.domain || 'auto' }}
          NAME_INPUT: ${{ inputs.name || '' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || false }}
        run: |
          DOMAIN_ARG=""
          if [ "$DOMAIN_INPUT" != "auto" ] && [ -n "$DOMAIN_INPUT" ]; then
            DOMAIN_ARG="--domain $DOMAIN_INPUT"
          fi

          NAME_ARG=""
          if [ -n "$NAME_INPUT" ]; then
            NAME_ARG="--name $NAME_INPUT"
          fi

          DRY_RUN_ARG=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          python main.py $DOMAIN_ARG $NAME_ARG $DRY_RUN_ARG

      - name: Commit showcase updates
        if: success()
        run: |
          git config user.name "autod[bot]"
          git config user.email "autod[bot]@users.noreply.github.com"
          git fetch origin main || true
          git rebase origin/main || git rebase --abort || true
          git add -A SHOWCASE.md created_repos.json 2>/dev/null || git add -A || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update portfolio showcase with newly synthesized repository"
            git push origin main || true
          fi
